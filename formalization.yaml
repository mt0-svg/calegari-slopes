# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "calegari-slopes"
  description: >-
    Calegari's conjecture: the slopes of the Atkin operator U_3 on 3-adic overconvergent cusp forms of tame level 1
    and weight 0 are 2i + 2v_3((2i)!/i!), i >= 1, each with multiplicity one; and the valuations of the coefficients
    of the characteristic series of the matrix of U_3. Through Loeffler's factorization U = ADB of that matrix.
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Spectral expansions of overconvergent modular functions"
    authors: ["David Loeffler"]
    id: "https://doi.org/10.1093/imrn/rnm050"
    type: article
    location: "Section 3: Calegari's conjecture on the slopes and the factorization U = ADB (arXiv:math/0701168)"
    relationship: formalizes
    note: "the conjecture, which Smithline records as Calegari's (Compact operators with rational generation, CRM Proc. Lecture Notes 36, 2004)"
    author_endorsement: not-contacted
  - title: "Slopes of overconvergent 3-adic modular forms of weight zero"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/calegari-slopes"
    type: original-proof
    location: "paper/main.tex, Theorem 1.2 and Corollary 7.1"
    relationship: formalizes
    author_endorsement: n/a

related_formalizations: []

