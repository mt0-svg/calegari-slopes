  status: agent-reviewed
  notes: "The proof was refereed by agents with fresh context; Comparator checks the two main statements against statement files that import only Mathlib, Lemma 8.1 and Theorem 8.2 against a statement file that imports in addition the definitions of Loeffler's factors, and Corollaries 8.3 and 8.4 against one that imports in addition the definitions of the sequence spaces and of the eigenvectors of Theorem 2.4(a)."
