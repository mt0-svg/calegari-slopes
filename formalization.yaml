      comparator_config: "config-conj5-spectral.json"
      literature_dependencies: []

automation:
  methods:
    - method: agent

fidelity:
  divergences: >-
    The space of overconvergent cusp forms is the space of q-expansions of the series sum_m beta_m j^(-m) with
    |beta_m| 3^(tm) -> 0 for some t > 0 (Section 1 of the paper); the formal statement does not use that U_3 maps it
    into itself. Sequences are indexed from 0 in the formal proof. Theorem 2.4 and the proof of Theorem 1.2 are
    stated for any series G satisfying the two parts of Theorem 2.1, then applied to g. In Section 8 the valuation
    of an entry gamma^(j-i) x of A^(r) or B^(r), x rational and nonzero, is written v_3(x) + (6r - 3)(j - i), the
    zero entries being exempted, and Corollaries 8.3 and 8.4 are stated for every family (x_n, lambda_n) with the
    properties of Theorem 2.4(a) and every gamma with v_3(gamma) = 6r - 3; the paper and the formal statements are
    about the matrices u^(r) and say nothing about the forms of radius r.

